<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MrShine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background-color: #333;
            color: white;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #007bff;
        }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            background: #444;
        }
        .sidebar a:hover {
            background-color: #007bff;
        }
        .main-content {
            flex-grow: 1;
            padding: 30px;
            box-sizing: border-box;
        }
        .header {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 14px;
        }
        .card p {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MrShine Admin</h2>
        <a href="#">Dashboard</a>
        <a href="#">Bookings</a>
        <a href="#">Customers</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Dashboard Overview</h2>
            <span>Welcome, Admin</span>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total Bookings</h3>
                <p>24</p>
            </div>
            <div class="card">
                <h3>Active Services</h3>
                <p>12</p>
            </div>
            <div class="card">
                <h3>Revenue</h3>
                <p>₹15,400</p>
            </div>
        </div>
    </div>

</body>
</html>
