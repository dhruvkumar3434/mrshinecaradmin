<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MrShine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background-color: #333;
            color: white;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            color: #007bff;
        }
        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            background: #444;
        }
        .sidebar a:hover {
            background-color: #007bff;
        }
        .main-content {
            flex-grow: 1;
            padding: 30px;
            box-sizing: border-box;
        }
        .header {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .btn-accept {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-reject {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .status {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MrShine Admin</h2>
        <a href="#">Dashboard</a>
        <a href="#">Orders</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Customer Orders Management</h2>
            <span>Admin ID: <b>admin</b></span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>#101</td>
                    <td>Rahul Sharma</td>
                    <td>Car Wash & Detailing</td>
                    <td><span id="status-1" class="status" style="color: orange;">Pending</span></td>
                    <td>
                        <button class="btn-accept" onclick="updateStatus(1, 'Accepted')">Accept</button>
                        <button class="btn-reject" onclick="updateStatus(1, 'Rejected')">Reject</button>
                    </td>
                </tr>
                <tr>
                    <td>#102</td>
                    <td>Aman Verma</td>
                    <td>Interior Cleaning</td>
                    <td><span id="status-2" class="status" style="color: orange;">Pending</span></td>
                    <td>
                        <button class="btn-accept" onclick="updateStatus(2, 'Accepted')">Accept</button>
                        <button class="btn-reject" onclick="updateStatus(2, 'Rejected')">Reject</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function updateStatus(orderId, statusText) {
            var statusSpan = document.getElementById('status-' + orderId);
            statusSpan.innerText = statusText;
            if(statusText === 'Accepted') {
                statusSpan.style.color = 'green';
            } else {
                statusSpan.style.color = 'red';
            }
        }
    </script>

</body>
</html>
